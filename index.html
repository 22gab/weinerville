let seenKills={}, seenChats={}, chatOpen=false, firstState=true;
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
ws.onopen=()=>{ if(started) ws.send(JSON.stringify({type:"name",name:myName})); };
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+(ss<10?"0":"")+ss; }
function esc(s){ return (""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function burst(px,py,n,hue,white){ for(let i=0;i<n;i++){ const a=Math.random()*7, sp=Math.random()*260+40;
  particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:Math.random()*1.2+1,r:Math.random()*3+1.5,hue,white:white&&Math.random()<.4}); } }
function addKillLine(k,mid,v){ const el=document.createElement("div"); el.className="kl";
  el.innerHTML='<span class="ka">'+esc(k)+'</span> <span class="kt">'+esc(mid)+'</span> <span class="kv">'+esc(v)+'</span>';
  killsEl.appendChild(el); while(killsEl.children.length>4) killsEl.removeChild(killsEl.firstChild); setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 7000); }
function addChatLine(name,txt){ const el=document.createElement("div"); el.className="cm"; const b=document.createElement("b"); b.textContent=name+": "; el.appendChild(b); el.appendChild(document.createTextNode(txt)); chatEl.appendChild(el); while(chatEl.children.length>6) chatEl.removeChild(chatEl.firstChild); setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 6000); }
ws.onmessage=(ev)=>{ const d=JSON.parse(ev.data);
  if(d.type==="welcome"){ me=d.id; if(d.buildings) buildings=d.buildings; }
  if(d.type==="state"){ const np=d.players; bullets=d.bullets||[]; pellets=d.pellets||[];
    for(const id in np){ const p=np[id];
      if(prevHp[id]!=null && p.hp<prevHp[id] && !p.dead){ if(dist(p)<560) sHit(); burst(p.x,p.y,5,20,false); }
      if(prevAlive[id] && p.dead){ burst(p.x,p.y,30,20,true); if(dist(p)<620){ sDeath(); shake=Math.max(shake, id===me?18:8); } }
      prevHp[id]=p.hp; prevAlive[id]=!p.dead;
    }
    players=np;
    if(d.killfeed){ for(const k of d.killfeed){ if(!seenKills[k.id]){ seenKills[k.id]=1; if(!firstState){ const m=(""+k.txt).match(/^(.*?) (ha grigliato|è finito sulla brace di|ha servito|si è bruciacchiato contro|ha fatto una salsiccia di|è stato messo alla griglia da|ha distrutto|umiliato da|ha mandato a casa|passato alla piastra da) (.*)$/); if(m){ addKillLine(m[1],m[2],m[3]); } else { addKillLine("", k.txt, ""); } } } } }
    if(d.chat){ for(const c of d.chat){ if(!seenChats[c.id]){ seenChats[c.id]=1; if(!firstState) addChatLine(c.name,c.txt); } } }
    firstState=false;
    if(d.timer!=null){ timerEl.textContent=fmt(d.timer); timerEl.classList.toggle("warn",d.timer<=15); }
    if(d.phase==="over"){ overEl.classList.add("show");
      if(d.rank&&d.rank.length){ winnerEl.textContent="🏆 "+d.rank[0].name;
        rankEl.innerHTML=d.rank.map((r,i)=>'<div class="row"><span class="pos">'+(i+1)+'</span><span class="nm">'+esc(r.name)+'</span><span class="sc">'+r.score+'</span></div>').join(""); }
      nextEl.textContent="Nuova partita a breve...";
    } else overEl.classList.remove("show");
    if(me&&players[me]){ const p=players[me];
      const nowDead=(p.dead&&d.phase==="playing");
      deadEl.style.display = nowDead ? "flex" : "none";
      if(nowDead){ deadBy.textContent = p.killedBy ? ("· sei stato grigliato da "+p.killedBy) : ""; }
      if(wasDead && !p.dead){ x=p.x; y=p.y; camx=p.x; camy=p.y; respawnLock=0.35; }
      wasDead=p.dead;
      let amStr = isTouch ? (" · Munizioni: "+(p.ammo!=null?p.ammo:0)) : "";
      hud.textContent="Grigliate: "+(p.score||0)+amStr;
      const hp=Math.max(0,p.hp); hpFill.style.transform="scaleX("+(hp/100)+")"; hpTxt.textContent=hp; hpBar.classList.toggle("low",hp<=40);
      const am=p.ammo!=null?p.ammo:0; amFill.style.transform="scaleX("+(am/MAX_AMMO)+")"; amTxt.textContent=am; amBar.classList.toggle("empty",am<=0);
      if(am>prevAmmo){ sPick(); popups.push({x:x,y:y-30,vy:-40,life:1,txt:"+"+(am-prevAmmo)}); } prevAmmo=am;
      if(!p.dead && respawnLock<=0 && (Math.abs(p.x-x)>200||Math.abs(p.y-y)>200)){ x=p.x; y=p.y; }
    } } };
function dist(p){ return Math.hypot(p.x-x,p.y-y); }
window.onmousemove=e=>{ mx=e.clientX; my=e.clientY; };
function aimMouse(){ return Math.atan2((my-cv.height/2)/ZOOM, (mx-cv.width/2)/ZOOM); }
function shoot(){ if(started&&ws.readyState===1&&me&&players[me]&&!players[me].dead&&players[me].ammo>0){ ws.send(JSON.stringify({type:"shoot",x:x,y:y,a:ang})); sShoot(); shake=Math.max(shake,1.5); } }
if(!isTouch){ window.onmousedown=()=>{ if(started&&!chatOpen) shoot(); }; }
function openChat(){ if(isTouch)return; chatOpen=true; chatInput.classList.add("show"); chatInput.value=""; chatInput.focus(); }
function closeChat(){ chatOpen=false; chatInput.classList.remove("show"); chatInput.blur(); }
chatInput.addEventListener("keydown",e=>{ e.stopPropagation();
  if(e.key==="Enter"){ const t=chatInput.value.trim(); if(t&&ws.readyState===1) ws.send(JSON.stringify({type:"chat",txt:t})); closeChat(); }
  else if(e.key==="Escape"){ closeChat(); } });
window.onkeydown=e=>{
  if(chatOpen) return;
  if((e.key==="t"||e.key==="T") && started && !isTouch){ e.preventDefault(); openChat(); return; }
  keys[e.key.toLowerCase()]=true;
};
window.onkeyup=e=>{ keys[e.key.toLowerCase()]=false; };
const stickL=document.getElementById("stickL"), nubL=document.getElementById("nubL");
const stickR=document.getElementById("stickR"), nubR=document.getElementById("nubR");
function bindZone(side, onMove, onEnd){
  let id=null, ox=0, oy=0; const R=52;
  const stick = side==="L"?stickL:stickR, nub = side==="L"?nubL:nubR;
  window.addEventListener("touchstart",function(e){
    for(const t of e.changedTouches){
      const leftHalf = t.clientX < window.innerWidth/2;
      if((side==="L")===leftHalf && id===null){
        id=t.identifier; ox=t.clientX; oy=t.clientY;
        stick.style.left=ox+"px"; stick.style.top=oy+"px";
        stick.classList.add("act"); nub.style.transform="translate(0,0)";
      }
    }
  },{passive:false});
  window.addEventListener("touchmove",function(e){
    for(const t of e.changedTouches){ if(t.identifier===id){ e.preventDefault();
      let dx=t.clientX-ox, dy=t.clientY-oy; const d=Math.hypot(dx,dy); if(d>R){ dx=dx/d*R; dy=dy/d*R; }
      nub.style.transform="translate("+dx+"px,"+dy+"px)"; onMove(dx/R,dy/R,Math.min(1,d/R)); } }
  },{passive:false});
  const end=function(e){ for(const t of e.changedTouches){ if(t.identifier===id){ id=null; stick.classList.remove("act"); nub.style.transform="translate(0,0)"; onEnd(); } } };
  window.addEventListener("touchend",end); window.addEventListener("touchcancel",end);
}
if(isTouch){
  bindZone("L",function(nx,ny,mag){ moveVec.x=nx; moveVec.y=ny; moveVec.mag=mag; }, function(){ moveVec.x=0; moveVec.y=0; moveVec.mag=0; });
  bindZone("R",function(nx,ny,mag){ aimVec.x=nx; aimVec.y=ny; aimVec.active=mag>0.3; }, function(){ aimVec.active=false; });
  setInterval(function(){ if(aimVec.active){ shoot(); } }, 260);
}
function hueOf(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))%360; return h; }
function lerpA(a,b,t){ const d=Math.atan2(Math.sin(b-a),Math.cos(b-a)); return a+d*t; }
function collide(nx,ny){ for(const b of buildings){ const cx=Math.max(b.x,Math.min(nx,b.x+b.w)), cy=Math.max(b.y,Math.min(ny,b.y+b.h)); const dx=nx-cx,dy=ny-cy; if(dx*dx+dy*dy<20*20){ const d=Math.hypot(dx,dy)||0.01; nx+=dx/d*(20-d); ny+=dy/d*(20-d); } } return {x:nx,y:ny}; }
setInterval(function(){ if(started&&ws.readyState===1) ws.send(JSON.stringify({type:"move",x,y,a:ang})); }, 33);
function W2S(wx,wy){ return { sx:(wx-camx)*ZOOM+cv.width/2, sy:(wy-camy)*ZOOM+cv.height/2 }; }
function sausageShape(size){
  const len=size*2.2, w=size*1.05, r=w/2, x0=-len/2+r, x1=len/2-r;
  ctx.beginPath(); ctx.moveTo(x0,-r); ctx.lineTo(x1,-r); ctx.arc(x1,0,r,-Math.PI/2,Math.PI/2); ctx.lineTo(x0,r); ctx.arc(x0,0,r,Math.PI/2,-Math.PI/2); ctx.closePath();
}
function sausage(sx,sy,a,size,hue,isMe,hp,name){
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(a);
  const len=size*2.2, w=size*1.05, r=w/2, x0=-len/2+r, x1=len/2-r;
  const g=ctx.createLinearGradient(-len/2,0,len/2,0);
  g.addColorStop(0,"hsl("+hue+",70%,64%)"); g.addColorStop(0.5,"hsl("+hue+",72%,54%)"); g.addColorStop(1,"hsl("+hue+",72%,42%)");
  ctx.shadowBlur=12; ctx.shadowColor="hsl("+hue+",90%,55%)"; ctx.fillStyle=g;
  sausageShape(size); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle="rgba(60,25,10,0.3)"; ctx.lineWidth=w*0.12;
  for(let i=0;i<3;i++){ const gx=x0+(x1-x0)*((i+0.5)/3); ctx.beginPath(); ctx.moveTo(gx,-r*0.7); ctx.lineTo(gx,r*0.7); ctx.stroke(); }
  ctx.fillStyle="rgba(255,255,255,0.2)"; ctx.beginPath(); ctx.ellipse(0,-r*0.4,len*0.3,r*0.22,0,0,7); ctx.fill();
  ctx.restore();
  const bw=len;
  ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(sx-bw/2,sy-size-16,bw,5);
  ctx.fillStyle=hp>40?"#8ef07a":"#ff6a5a"; ctx.fillRect(sx-bw/2,sy-size-16,bw*Math.max(0,hp)/100,5);
  if(name){ ctx.fillStyle=isMe?"#ffcf6b":"rgba(255,255,255,0.7)"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.fillText(name,sx,sy-size-22); }
}
function ghost(sx,sy,a,size,alpha){
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(a); ctx.globalAlpha=alpha*0.28;
  ctx.fillStyle="#7fdcff"; sausageShape(size); ctx.fill(); ctx.globalAlpha=1; ctx.restore();
}
function sprintRing(sx,sy,frac,exhausted){
  const rad=32;
  ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.strokeStyle="rgba(0,0,0,0.35)"; ctx.lineWidth=5; ctx.stroke();
  if(frac>0.001){ ctx.beginPath(); ctx.arc(sx,sy,rad,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);
    ctx.strokeStyle=exhausted?"#ff6a5a":"#4dd2ff"; ctx.lineWidth=4; ctx.lineCap="round"; ctx.stroke(); ctx.lineCap="butt"; }
}
function drawBuildings(){
  for(const b of buildings){
    const s=W2S(b.x,b.y); const bw=b.w*ZOOM, bh=b.h*ZOOM;
    if(s.sx>cv.width||s.sy>cv.height||s.sx+bw<0||s.sy+bh<0) continue;
    ctx.fillStyle="#1a1f2b"; ctx.strokeStyle="#3a4a63"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(s.sx,s.sy,bw,bh,10); ctx.fill(); ctx.stroke();
    ctx.strokeStyle="rgba(90,180,255,0.25)"; ctx.lineWidth=1;
    ctx.strokeRect(s.sx+8,s.sy+8,bw-16,bh-16);
  }
}
function drawPellets(t){
  for(const pe of pellets){ const s=W2S(pe.x,pe.y);
    if(s.sx<-20||s.sy<-20||s.sx>cv.width+20||s.sy>cv.height+20) continue;
    const pulse=1+Math.sin(t/200+pe.id)*0.15;
    ctx.shadowBlur=8; ctx.shadowColor="#ffd24d"; ctx.fillStyle="#ffe27a";
    ctx.beginPath(); ctx.arc(s.sx,s.sy,6*pulse*ZOOM,0,7); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle="rgba(255,255,255,0.7)"; ctx.beginPath(); ctx.arc(s.sx-1.5,s.sy-1.5,1.8,0,7); ctx.fill(); }
}
function drawMini(){
  const W=mini.width, H=mini.height;
  mctx.clearRect(0,0,W,H); mctx.fillStyle="rgba(0,0,0,0.3)"; mctx.fillRect(0,0,W,H);
  const sx=W/WORLD_W, sy=H/WORLD_H;
  mctx.fillStyle="rgba(120,150,190,0.5)";
  for(const b of buildings){ mctx.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy); }
  mctx.fillStyle="#ffe27a";
  for(const pe of pellets){ mctx.fillRect(pe.x*sx-0.8,pe.y*sy-0.8,1.6,1.6); }
  for(const id in players){ const p=players[id]; if(p.dead) continue;
    mctx.fillStyle = id===me ? "#ffcf6b" : "hsl("+hueOf(id)+",85%,60%)";
    mctx.beginPath(); mctx.arc(p.x*sx, p.y*sy, id===me?2.6:2, 0, 7); mctx.fill(); }
}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; if(dt>0.05)dt=0.05; last=now;
  if(respawnLock>0) respawnLock-=dt;
  const dead = me&&players[me]&&players[me].dead;
  let sprinting=false;
  if(started && !dead && !chatOpen && respawnLock<=0){
    let dx=0,dy=0;
    if(isTouch){ dx=moveVec.x; dy=moveVec.y; }
    else { if(keys["arrowup"]||keys["w"])dy-=1; if(keys["arrowdown"]||keys["s"])dy+=1; if(keys["arrowleft"]||keys["a"])dx-=1; if(keys["arrowright"]||keys["d"])dx+=1; }
    const ml=Math.hypot(dx,dy);
    let wantSprint=false;
    if(isTouch){ wantSprint=(moveVec.mag||0)>0.9; } else { wantSprint=(keys["shift"]||keys["shiftleft"]||keys["shiftright"]); }
    let spd=260;
    if(exhaust>0){
      exhaust-=dt;
      if(exhaust<=0){ exhaust=0; stamina=1; } else { stamina=0; }
    } else if(wantSprint && ml>0 && stamina>0){
      spd=260*1.8; stamina-=dt*0.5; sprinting=true;
      if(stamina<=0){ stamina=0; exhaust=3; sprinting=false; spd=260; }
    } else {
      stamina=Math.min(1, stamina+dt*0.28);
    }
    if(ml>0){ let nx=x+dx/ml*spd*dt, ny=y+dy/ml*spd*dt; const c=collide(nx,ny); x=Math.max(20,Math.min(WORLD_W-20,c.x)); y=Math.max(20,Math.min(WORLD_H-20,c.y)); }
    let targetAng=ang;
    if(isTouch){ if(aimVec.active) targetAng=Math.atan2(aimVec.y,aimVec.x); else if(ml>0) targetAng=Math.atan2(dy,dx); }
    else { targetAng=aimMouse(); }
    ang=lerpA(ang,targetAng,Math.min(1,dt*20));
    if(sprinting && Math.random()<0.6){ trail.push({x:x,y:y,a:ang,life:1}); }
  } else { if(exhaust>0){ exhaust-=dt; if(exhaust<=0){exhaust=0; stamina=1;} } else { stamina=Math.min(1, stamina+dt*0.28); } }
  for(let i=trail.length-1;i>=0;i--){ trail[i].life-=dt*4.5; if(trail[i].life<=0) trail.splice(i,1); }
  camx+=(x-camx)*Math.min(1,dt*10); camy+=(y-camy)*Math.min(1,dt*10);
  ctx.fillStyle="#0b0d12"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  shake*=Math.pow(.0015,dt); if(shake<.2)shake=0;
  if(shake>0) ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
  drawBuildings();
  drawPellets(now);
  for(const g of trail){ const s=W2S(g.x,g.y); ghost(s.sx, s.sy, g.a, 20*ZOOM, g.life); }
  for(const b of bullets){ const s=W2S(b.x,b.y);
    if(s.sx<-10||s.sy<-10||s.sx>cv.width+10||s.sy>cv.height+10) continue;
    ctx.shadowBlur=6; ctx.shadowColor="#ffd24d"; ctx.fillStyle="#ffe27a"; ctx.beginPath(); ctx.arc(s.sx,s.sy,4*ZOOM,0,7); ctx.fill(); ctx.shadowBlur=0; }
  const sm=Math.min(1,dt*16);
  for(const id in players){ const p=players[id];
    if(!disp[id]) disp[id]={x:p.x,y:p.y,a:p.a};
    disp[id].x+=(p.x-disp[id].x)*sm;
    disp[id].y+=(p.y-disp[id].y)*sm;
    disp[id].a=lerpA(disp[id].a,p.a,sm); }
  if(me&&players[me]&&!players[me].dead) disp[me]={x:x,y:y,a:ang};
  for(const id in disp){ const p=players[id]; if(!p||p.dead) continue; const d=disp[id];
    const s=W2S(d.x,d.y);
    if(s.sx<-60||s.sy<-60||s.sx>cv.width+60||s.sy>cv.height+60) continue;
    if(id===me){ sprintRing(s.sx,s.sy, exhaust>0?(exhaust/3):stamina, exhaust>0); }
    sausage(s.sx, s.sy, d.a, 20*ZOOM, id===me?40:hueOf(id), id===me, p.hp, p.name); }
  for(let i=particles.length-1;i>=0;i--){ const pt=particles[i]; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vx*=.92; pt.vy*=.92; pt.life-=pt.dec*dt;
    if(pt.life<=0){ particles.splice(i,1); continue; }
    const s=W2S(pt.x,pt.y);
    ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.white?"#fff":"hsl("+pt.hue+",90%,62%)";
    ctx.beginPath(); ctx.arc(s.sx,s.sy,pt.r*ZOOM,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  for(let i=popups.length-1;i>=0;i--){ const pu=popups[i]; pu.y+=pu.vy*dt; pu.life-=dt*1.3;
    if(pu.life<=0){ popups.splice(i,1); continue; }
    const s=W2S(pu.x,pu.y);
    ctx.globalAlpha=Math.max(0,pu.life); ctx.fillStyle="#ffe27a"; ctx.font="bold 18px sans-serif"; ctx.textAlign="center";
    ctx.shadowBlur=6; ctx.shadowColor="#000"; ctx.fillText(pu.txt,s.sx,s.sy); ctx.shadowBlur=0; }
  ctx.globalAlpha=1;
  ctx.restore();
  drawMini();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
